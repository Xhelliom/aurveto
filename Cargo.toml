[package]
name = "aurveto"
version = "0.2.0"
edition = "2021"
description = "Security gate for AUR updates: delay, whitelist, static scan and AI review of the PKGBUILD diff"
license = "MIT"
repository = "https://github.com/Xhelliom/aurveto"

[lib]
name = "aurveto"
path = "src/lib.rs"

[[bin]]
name = "aurveto"
path = "src/main.rs"

[[bin]]
name = "aurveto-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[features]
default = ["tui", "gui"]
tui = ["dep:ratatui", "dep:crossterm"]
gui = ["dep:gtk4", "dep:libadwaita", "dep:async-channel"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["json", "tls"] }
anyhow = "1"
dirs = "5"
gettext-rs = { version = "0.7", features = ["gettext-system"] }
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
gtk4 = { version = "0.9", optional = true }
libadwaita = { version = "0.7", optional = true, features = ["v1_5"] }
async-channel = { version = "2", optional = true }

[profile.release]
strip = true
lto = true
opt-level = "z"
